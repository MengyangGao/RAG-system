[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "rag-system"
version = "2.1.0"
description = "A local document workspace with inspectable retrieval and evidence-linked answers."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "RAG-system contributors"}]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.54.0,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "pypdf>=6.19.0,<7", "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=6.1.0,<7"]

[dependency-groups]
browser = [
    "playwright>=1.63.0,<2",
]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.16.9,<1", "mypy>=2.3.1,<3"]

[project.scripts]
rag-system = "rag_system.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

